name: Build desktop apps

# Builds the Windows and macOS desktop apps and the Android APK.
# - Push a tag like `v1.3.0` to build AND publish a GitHub Release with all three attached.
# - Or trigger manually (Actions tab -> "Run workflow") to just get downloadable artifacts.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.38.5"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build windows --release

      # Zip the whole Release folder (exe + DLLs + data/ must stay together).
      - name: Package Windows build
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          Compress-Archive -Path "$src/*" -DestinationPath "mtg_artwork_picker-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: mtg_artwork_picker-windows-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build macos --release

      # ditto preserves the .app bundle (symlinks, permissions) inside the zip.
      - name: Package macOS build
        run: |
          APP="build/macos/Build/Products/Release/mtg_artwork_picker.app"
          ditto -c -k --keepParent "$APP" "mtg_artwork_picker-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: mtg_artwork_picker-macos.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs

      # The keystore is held as a base64 secret; Gradle reads the decoded path
      # and the passwords from the env vars set on the build step below.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. A release APK must not be" \
                 "signed with throwaway debug keys, because the next build would produce" \
                 "a different signature and block in-place upgrades."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      # Fail loudly rather than shipping an APK that silently fell back to the
      # debug keys: the fallback exists for contributors, not for releases.
      - name: Verify the APK is signed with the release key
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SIGNER=$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null |
                   sort -V | tail -1)
          if [ -z "$SIGNER" ]; then
            echo "::error::apksigner not found under $SDK — cannot verify the APK signature."
            exit 1
          fi
          "$SIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          if grep -qi "CN=Android Debug" certs.txt; then
            echo "::error::APK is debug-signed — the release signing config was not applied."
            exit 1
          fi

      - name: Name the APK after the version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          cp build/app/outputs/flutter-apk/app-release.apk "proxystant-$VERSION.apk"
          ls -l "proxystant-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: proxystant-*.apk

  release:
    # Only publish a Release when a tag was pushed.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-build/mtg_artwork_picker-windows-x64.zip
            artifacts/macos-build/mtg_artwork_picker-macos.zip
            artifacts/android-build/proxystant-*.apk
          generate_release_notes: true
